[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketflow-ai"
version = "0.1.0"
description = "Sanitized portfolio project for ticket monitoring, workflow automation and AI-assisted structured extraction."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
